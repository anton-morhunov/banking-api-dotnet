name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/BankAPI.API/BankAPI.API.csproj

      - name: Build
        run: dotnet build src/BankAPI.API/BankAPI.API.csproj --no-restore

      - name: Test
        run: dotnet test tests/BankAPI.UnitTests/BankAPI.UnitTests.csproj --no-build
